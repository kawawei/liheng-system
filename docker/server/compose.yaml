name: ${PROJECT_NAME:-liheng-system}

services:
  # ========================================
  # 資料庫容器 (PostgreSQL 16 + pgvector)
  # ========================================
  postgres:
    container_name: ${PROJECT_NAME:-liheng-system}-postgres
    image: pgvector/pgvector:pg16
    ports:
      - "${DB_PORT:-5435}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-liheng_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-liheng_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-liheng_admin} -d ${DB_NAME:-liheng_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ========================================
  # 快取與黑名單 (Redis 7.2 Alpine)
  # ========================================
  redis:
    container_name: ${PROJECT_NAME:-liheng-system}-redis
    image: redis:7.2-alpine
    ports:
      - "${REDIS_PORT:-6382}:6379"
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ========================================
  # 後端 API 服務 (Node.js Express)
  # ========================================
  backend:
    container_name: ${PROJECT_NAME:-liheng-system}-backend
    build:
      context: ../../
      dockerfile: docker/server/Dockerfile.backend
    ports:
      - "${BACKEND_PORT:-8084}:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-liheng_admin}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-liheng_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    volumes:
      - backend_uploads:/app/backend/uploads
      - backend_logs:/app/backend/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ========================================
  # 前端 Web 服務 (Nginx SPA)
  # ========================================
  frontend:
    container_name: ${PROJECT_NAME:-liheng-system}-frontend
    build:
      context: ../../
      dockerfile: docker/server/Dockerfile.frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
    ports:
      - "${FRONTEND_PORT:-84}:80"
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_logs:
